name: Build & Release Sona

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.1)'
        required: true
        default: '1.0.0'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Determine version
        id: ver
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          if ("${{ inputs.version }}") { $v = "${{ inputs.version }}".TrimStart('v') }
          echo "version=$v" >> $env:GITHUB_OUTPUT

      - name: Install & Build Frontend
        run: |
          npm ci
          npm run build

      - name: Publish Windows App
        run: dotnet publish native/windows/Sona.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o Sona-win

      - name: Build Windows Installer (Inno Setup)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          iscc /DAppVersion="${{ steps.ver.outputs.version }}" installer\windows\Sona.iss

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: release/*.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Determine version
        id: ver
        run: |
          V="${GITHUB_REF_NAME#v}"
          if [ -n "${{ inputs.version }}" ]; then V="${{ inputs.version#v }}"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Install & Build Frontend
        run: |
          npm ci
          npm run build

      - name: Build macOS Sona.app & DMG Installer
        run: |
          python3 -m pip install --quiet pillow || true
          chmod +x native/build_app.sh
          ./native/build_app.sh
          mkdir -p release dmg_stage
          cp -R Sona.app dmg_stage/
          cp -R backend dist package.json dmg_stage/Sona.app/Contents/Resources/ 2>/dev/null || true
          ln -s /Applications dmg_stage/Applications
          hdiutil create -volname "Sona" -srcfolder dmg_stage -ov -format UDZO "release/Sona-${{ steps.ver.outputs.version }}-macOS.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: release/*.dmg

  release:
    needs: [build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/windows-installer/*.exe
            artifacts/macos-installer/*.dmg
