name: Build & Release Mynil Music & Mynil Mono

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.9)'
        required: true
        default: '1.0.9'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Determine version
        id: ver
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          if ("${{ inputs.version }}") { $v = "${{ inputs.version }}".TrimStart('v') }
          echo "version=$v" >> $env:GITHUB_OUTPUT

      - name: Install Dependencies
        run: npm ci

      - name: Find or Install Inno Setup
        id: inno
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          $iscc = Get-Command iscc -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source
          if (-not $iscc) {
            $defaultPath = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
            if (Test-Path $defaultPath) {
              $iscc = $defaultPath
            } else {
              choco install innosetup -y --no-progress
              $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
            }
          }
          echo "iscc=$iscc" >> $env:GITHUB_OUTPUT

      - name: Build Mynil Music (Windows)
        shell: pwsh
        run: |
          npm run build
          dotnet publish native/windows/Sona.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -p:Version=${{ steps.ver.outputs.version }} -o Mynil-win
          & "${{ steps.inno.outputs.iscc }}" "/DAppVersion=${{ steps.ver.outputs.version }}" installer\windows\Sona.iss

      - name: Build Mynil Mono (Windows)
        shell: pwsh
        run: |
          Rename-Item -Path src -NewName src-color
          Rename-Item -Path src-mono -NewName src
          npm run build
          dotnet publish native/windows/Sona.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -p:Version=${{ steps.ver.outputs.version }} -o MynilMono-win
          & "${{ steps.inno.outputs.iscc }}" "/DAppVersion=${{ steps.ver.outputs.version }}" installer\windows\SonaMono.iss
          Rename-Item -Path src -NewName src-mono
          Rename-Item -Path src-color -NewName src

      - name: Optional Windows Code Signing
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERT_PFX_BASE64 -or -not $env:WINDOWS_CERT_PASSWORD) {
            Write-Host "Skipping Windows code signing (WINDOWS_CERT_PFX_BASE64 / WINDOWS_CERT_PASSWORD secrets not set)."
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if ($signtool) {
            Get-ChildItem release/*.exe | ForEach-Object {
              & $signtool sign /f $pfx /p $env:WINDOWS_CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $_.FullName
            }
          }
          Remove-Item $pfx -Force -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: release/*.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Determine version
        id: ver
        run: |
          V="${GITHUB_REF_NAME#v}"
          IN_VER="${{ inputs.version }}"
          if [ -n "$IN_VER" ]; then V="${IN_VER#v}"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Install Dependencies
        run: npm ci

      - name: Setup Python Pillow for Icons
        run: |
          python3 -m venv /tmp/mynil-venv
          /tmp/mynil-venv/bin/pip install --quiet pillow

      - name: Build Mynil Music (macOS DMG)
        run: |
          export PATH="/tmp/mynil-venv/bin:$PATH"
          npm run build
          chmod +x native/build_app.sh
          ./native/build_app.sh
          mkdir -p release dmg_stage
          cp -R "Mynil.app" dmg_stage/
          cp -R backend dist package.json "dmg_stage/Mynil.app/Contents/Resources/" 2>/dev/null || true
          xattr -cr "dmg_stage/Mynil.app"
          codesign --force --deep --sign - "dmg_stage/Mynil.app"
          ln -s /Applications dmg_stage/Applications
          hdiutil create -volname "Mynil Music" -srcfolder dmg_stage -ov -format UDZO "release/Mynil-${{ steps.ver.outputs.version }}-macOS.dmg"

      - name: Build Mynil Mono (macOS DMG)
        run: |
          export PATH="/tmp/mynil-venv/bin:$PATH"
          mv src src-color
          mv src-mono src
          npm run build
          chmod +x native/build_app_mono.sh
          ./native/build_app_mono.sh
          mkdir -p release dmg_stage_mono
          cp -R "Mynil Mono.app" dmg_stage_mono/
          cp -R backend dist package.json "dmg_stage_mono/Mynil Mono.app/Contents/Resources/" 2>/dev/null || true
          xattr -cr "dmg_stage_mono/Mynil Mono.app"
          codesign --force --deep --sign - "dmg_stage_mono/Mynil Mono.app"
          ln -s /Applications dmg_stage_mono/Applications
          hdiutil create -volname "Mynil Mono" -srcfolder dmg_stage_mono -ov -format UDZO "release/Mynil-Mono-${{ steps.ver.outputs.version }}-macOS.dmg"
          mv src src-mono
          mv src-color src

      - uses: actions/upload-artifact@v4
        with:
          name: macos-installers
          path: release/*.dmg

  release:
    needs: [build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/windows-installers/*.exe
            artifacts/macos-installers/*.dmg
