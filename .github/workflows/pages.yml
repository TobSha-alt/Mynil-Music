name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Mynil Music and Mynil Mono
        run: |
          npm run build
          cp -r src src.bak
          rm -rf src
          cp -r src-mono src
          npx vite build --outDir dist-mono
          rm -rf src
          mv src.bak src

      - name: Assemble Pages site
        run: |
          mkdir -p _site/app _site/mono
          cp website/index.html _site/index.html
          cp -r dist/* _site/app/
          cp -r dist-mono/* _site/mono/
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
